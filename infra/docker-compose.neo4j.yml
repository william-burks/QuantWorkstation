services:
  qws-neo4j:
    image: neo4j:5-community
    container_name: qws-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${QW_GRAPH_NEO4J_AUTH:-neo4j/password}
    volumes:
      - ./.qws/neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


