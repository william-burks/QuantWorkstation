[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantworkstation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Data store
    "arcticdb>=1.6",
    # Schemas + config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Brokers
    "alpaca-py>=0.20",
    "ib_insync>=0.9",
    # Scheduling
    "APScheduler>=3.10",
    # Research engines
    "vectorbt>=0.26",
    "backtrader>=1.9",
    # Stats / models
    "statsmodels>=0.14",
    "arch>=6",
    # HTTP
    "httpx>=0.27",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Observability
    "opentelemetry-sdk>=1.23",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    # Utilities
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",  # test client
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["data", "research", "strategies", "execution", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
