[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantworkstation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Data store
    "arcticdb>=1.6",
    # Schemas + config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Brokers
    "alpaca-py>=0.20",
    "ib_insync>=0.9",
    # Scheduling
    "APScheduler>=3.10",
    "prefect>=3.0",
    # Research engines
    "vectorbt>=0.26",
    # Stats / models
    "arch>=6",
    # HTTP
    "httpx>=0.27",
    # FRED macro data
    "fredapi>=0.5",
    # Excel parsing (Baker Hughes rig count)
    "openpyxl>=3.1",
    # Web scraping (BDTI from StockQ)
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    # Utilities
    "pandas>=2.2",
    "numpy>=1.26",
    # Graph store (Neo4j)
    "neo4j>=5,<6",
]

[project.scripts]
qw = "research.graph.cli:main"

[project.optional-dependencies]
macro = [
    # Google Trends retail sentiment (unofficial library — best-effort)
    "pytrends>=4.9",
]
graph = [
    # Local embedding model for `qw backfill --embeddings` semantic hypothesis dedup
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",  # test client
    "ruff>=0.4",
    "mypy>=1.9",
    "types-requests",
    "types-beautifulsoup4",
    "types-openpyxl",
    "types-pytz",
]

[tool.hatch.build.targets.wheel]
packages = ["data", "research", "strategies", "execution"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
