<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Companion</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --orange: #e3b341;
    --red: #f85149;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
    font-size: 14px;
    line-height: 1.5;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .streak-bar {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .streak-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .streak-count {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .streak-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .btn {
    background: var(--accent);
    color: #0d1117;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn:hover { opacity: 0.85; }

  .btn-ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  .btn-ghost:hover { background: rgba(88, 166, 255, 0.1); }

  /* Main layout */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }

  /* Topics sections */
  .topics-section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .topics-section-label.gap-label { color: var(--accent); }
  .topics-section-label.covered-label { color: var(--green); }

  .topics-section { margin-bottom: 20px; }

  /* Topics grid */
  .topics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .topic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .topic-card:hover {
    border-color: var(--accent);
    background: #1c2230;
  }

  .topic-card.covered {
    opacity: 0.75;
  }

  .topic-card.covered:hover {
    opacity: 1;
    border-color: var(--green);
  }

  .topic-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .topic-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .depth-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .depth-none      { background: rgba(110,118,129,0.15); color: var(--muted); }
  .depth-awareness { background: rgba(210,153,34,0.15);  color: var(--yellow); }
  .depth-working   { background: rgba(227,179,65,0.15);  color: var(--orange); }
  .depth-applied   { background: rgba(63,185,80,0.15);   color: var(--green); }
  .depth-mastered  { background: rgba(88,166,255,0.15);  color: #58a6ff; }

  .topic-desc {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .topic-meta {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  /* Bottom panels */
  .bottom-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  /* Recommendation card */
  .rec-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }

  .rec-text {
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
  }

  .rec-empty {
    color: var(--muted);
    font-style: italic;
  }

  .rec-date {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* Chat panel */
  .chat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    height: 420px;
  }

  .chat-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-user {
    align-self: flex-end;
    background: rgba(88, 166, 255, 0.15);
    border: 1px solid rgba(88, 166, 255, 0.25);
    color: var(--text);
  }

  .msg-assistant {
    align-self: flex-start;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .msg-assistant .save-rec-btn {
    display: block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .msg-assistant .save-rec-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .msg-thinking {
    align-self: flex-start;
    color: var(--muted);
    font-style: italic;
    font-size: 12px;
    padding: 4px 0;
  }

  .chat-input-row {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }

  .chat-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    resize: none;
    outline: none;
    transition: border-color 0.15s;
  }

  .chat-input:focus { border-color: var(--accent); }

  /* Log modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    width: 400px;
    max-width: 90vw;
  }

  .modal h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  .form-select, .form-input, .form-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }

  .form-select:focus,
  .form-input:focus,
  .form-textarea:focus { border-color: var(--accent); }

  .form-textarea { resize: vertical; min-height: 70px; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }

  /* Depth progress bar */
  .depth-bar {
    display: flex;
    gap: 3px;
    margin-top: 10px;
  }

  .depth-seg {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    transition: background 0.3s ease;
  }

  /* segment 1 = awareness, 2 = working, 3 = applied, 4 = mastered */
  .depth-seg:nth-child(1).filled { background: var(--yellow); }
  .depth-seg:nth-child(2).filled { background: var(--orange); }
  .depth-seg:nth-child(3).filled { background: var(--green); }
  .depth-seg:nth-child(4).filled { background: #58a6ff; }

  .empty-chat {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    margin: auto;
    padding: 20px;
  }

  code {
    font-family: "SFMono-Regular", Consolas, monospace;
    background: rgba(110,118,129,0.15);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }

  /* Topic detail modal */
  .topic-modal {
    width: 580px;
    max-width: 94vw;
    max-height: 88vh;
    overflow-y: auto;
  }

  .topic-modal::-webkit-scrollbar { width: 4px; }
  .topic-modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .topic-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
  }

  .topic-modal-header h2 { font-size: 17px; font-weight: 700; }

  .topic-modal-desc {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .curriculum-section {
    margin-bottom: 22px;
  }

  .curriculum-section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .curriculum-section-title.read    { color: #58a6ff; }
  .curriculum-section-title.explore { color: #bc8cff; }
  .curriculum-section-title.do      { color: #3fb950; }

  .curriculum-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(48,54,61,0.5);
  }

  .curriculum-item:last-child { border-bottom: none; }

  .item-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }

  .read .item-dot    { background: #58a6ff; }
  .explore .item-dot { background: #bc8cff; }
  .do .item-dot      { background: #3fb950; }

  .item-body { flex: 1; }

  .item-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
  }

  .item-sub {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .item-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }

  .tag-paper   { background: rgba(88,166,255,0.12); color: #58a6ff; }
  .tag-book    { background: rgba(188,140,255,0.12); color: #bc8cff; }
  .tag-dataset { background: rgba(63,185,80,0.12); color: #3fb950; }
  .tag-concept { background: rgba(227,179,65,0.12); color: var(--orange); }
  .tag-code    { background: rgba(110,118,129,0.15); color: var(--muted); }

  .item-status {
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    padding-top: 2px;
  }
  .status-btn {
    background: none;
    border: 1px solid rgba(110,118,129,0.3);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .status-btn:hover { opacity: 0.8; }
  .status-btn.unread  { color: var(--muted); border-color: rgba(110,118,129,0.3); }
  .status-btn.done    { color: #3fb950; border-color: rgba(63,185,80,0.4); background: rgba(63,185,80,0.08); }
  .status-btn.campus  { color: #e3b341; border-color: rgba(227,179,65,0.4); background: rgba(227,179,65,0.08); }

  /* Session mode */
  .session-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(63,185,80,0.07);
    border: 1px solid rgba(63,185,80,0.2);
    border-radius: 6px;
    margin-bottom: 18px;
  }
  .session-banner-label { font-size: 12px; color: var(--muted); flex: 1; }
  .session-timer { font-size: 14px; font-weight: 700; color: #3fb950; font-variant-numeric: tabular-nums; }
  .session-check {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(110,118,129,0.4);
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    padding: 0;
    color: transparent;
    font-size: 11px;
  }
  .session-check:hover { border-color: #3fb950; }
  .session-check.checked { background: #3fb950; border-color: #3fb950; color: #0d1117; }
  .session-check.checked::after { content: '✓'; }
  .curriculum-item.item-checked .item-title { opacity: 0.45; }
  .curriculum-item.item-checked .item-title a { opacity: 0.45; }
  .session-notes-section {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .session-notes-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .session-notes-input {
    width: 100%;
    min-height: 80px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 10px 12px;
    resize: vertical;
    font-family: inherit;
    box-sizing: border-box;
  }
  .session-notes-input:focus { outline: none; border-color: rgba(63,185,80,0.4); }
  .session-notes-input::placeholder { color: rgba(110,118,129,0.5); }
  .url-edit-btn {
    display: inline-flex;
    align-items: center;
    margin-left: 6px;
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 11px;
    padding: 0 2px;
    vertical-align: middle;
    transition: opacity 0.15s, color 0.15s;
  }
  .curriculum-item:hover .url-edit-btn { opacity: 1; }
  .url-edit-btn:hover { color: var(--text); }
  .url-inline-input {
    width: 100%;
    margin-top: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(88,166,255,0.4);
    border-radius: 4px;
    color: var(--text);
    font-size: 12px;
    padding: 4px 8px;
    font-family: monospace;
    box-sizing: border-box;
  }
  .url-inline-input:focus { outline: none; }

  .topic-modal-footer {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .priority-badge {
    font-size: 11px;
    color: var(--muted);
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    align-self: center;
    margin-left: auto;
  }
</style>
</head>
<body>

<header>
  <h1>Learning Companion</h1>
  <div class="streak-bar">
    <div class="streak-item">
      <span class="streak-count" id="streak-current">—</span>
      <span class="streak-label">Day streak</span>
    </div>
    <div class="streak-item">
      <span class="streak-count" id="streak-longest">—</span>
      <span class="streak-label">Best streak</span>
    </div>
    <button class="btn btn-ghost" onclick="openSessionLog()">Session Log</button>
    <button class="btn" onclick="openModal()">Log Session</button>
  </div>
</header>

<main>
  <div id="topics-container"></div>

  <div class="bottom-grid">
    <div class="rec-card">
      <div class="card-title">Next Up</div>
      <div id="rec-text" class="rec-text rec-empty">Ask the agent "what should I read next?"</div>
      <div id="rec-date" class="rec-date"></div>
    </div>

    <div class="chat-card">
      <div class="chat-header">
        <span class="card-title" style="margin:0">Chat with Learning Companion</span>
        <button class="btn btn-ghost" onclick="clearChat()" style="font-size:11px;padding:4px 10px;">Clear</button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="empty-chat">Ask a theory question, request reading recommendations,<br>or say "quiz me on #11 factor models"</div>
      </div>
      <div class="chat-input-row">
        <textarea
          class="chat-input"
          id="chat-input"
          rows="2"
          placeholder="Ask a question..."
          onkeydown="handleKey(event)"
        ></textarea>
        <button class="btn" onclick="sendMessage()" id="send-btn">Send</button>
      </div>
    </div>
  </div>
</main>

<!-- Topic Detail Modal -->
<div class="modal-overlay" id="topic-overlay" onclick="closeTopicIfOutside(event)">
  <div class="modal topic-modal" id="topic-modal-body"></div>
</div>

<!-- Session Log Modal -->
<div class="modal-overlay" id="session-log-overlay" onclick="closeSessionLogIfOutside(event)">
  <div class="modal" style="max-width:600px;max-height:80vh;overflow-y:auto">
    <h2>Session Log</h2>
    <div id="session-log-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeSessionLog()">Close</button>
    </div>
  </div>
</div>

<!-- Log Session Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalIfOutside(event)">
  <div class="modal">
    <h2>Log Study Session</h2>
    <div class="form-group">
      <label class="form-label">Topic</label>
      <select class="form-select" id="log-topic"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Duration (minutes)</label>
      <input class="form-input" type="number" id="log-duration" value="30" min="5" max="180">
    </div>
    <div class="form-group">
      <label class="form-label">Depth after this session</label>
      <select class="form-select" id="log-depth">
        <option value="none">None — skimmed, not retained</option>
        <option value="awareness">Awareness — can define key terms</option>
        <option value="working">Working — can explain and apply</option>
        <option value="applied">Applied — used in QuantWorkstation</option>
        <option value="mastered">Mastered — theory + implementation, could teach it</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Notes (optional)</label>
      <textarea class="form-textarea" id="log-notes" placeholder="What did you read? Key insight?"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitLog()">Save Session</button>
    </div>
  </div>
</div>

<script>
  let appData = null;
  let chatHistory = [];  // [{role, content}] for the API
  let isStreaming = false;
  let activeSession = null; // { topicId, startTime, checkedItems: Set, timerInterval }

  // ---- Boot ----

  async function boot() {
    const data = await fetchData();
    render(data);
  }

  async function fetchData() {
    const res = await fetch('/api/data');
    appData = await res.json();
    return appData;
  }

  function render(data) {
    // Streaks
    document.getElementById('streak-current').textContent = data.streaks.current;
    document.getElementById('streak-longest').textContent = data.streaks.longest;

    // Topics — split into gap and covered sections
    const container = document.getElementById('topics-container');
    container.innerHTML = '';

    const DEPTH_ORDER = ['none', 'awareness', 'working', 'applied', 'mastered'];

    function depthBar(depth) {
      const idx = DEPTH_ORDER.indexOf(depth);
      return `<div class="depth-bar">${[1,2,3,4].map(i =>
        `<div class="depth-seg${idx >= i ? ' filled' : ''}"></div>`
      ).join('')}</div>`;
    }

    function topicCard(topic) {
      const depth = data.topic_depth[topic.id] || 'none';
      const count = data.sessions.filter(s => s.topic_id === topic.id).length;
      const lastSession = [...data.sessions].reverse().find(s => s.topic_id === topic.id);
      const lastDate = lastSession ? lastSession.date : null;
      const coveredClass = topic.gap ? '' : ' covered';
      return `
        <div class="topic-card${coveredClass}" onclick="openTopicDetail('${topic.id}')">
          <div class="topic-card-header">
            <span class="topic-name">${topic.name}</span>

  function handleKey(e) {

  }

  function clearChat() {
    chatHistory = [];
    const container = document.getElementById('chat-messages');
    container.innerHTML = '<div class="empty-chat">Ask a theory question, request reading recommendations,<br>or say "quiz me on #11 factor models"</div>';
  }

  async function sendMessage() {
    if (isStreaming) return;
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    isStreaming = true;
    document.getElementById('send-btn').disabled = true;

    // Clear empty state
    const container = document.getElementById('chat-messages');
    const empty = container.querySelector('.empty-chat');
    if (empty) empty.remove();

    // Append user message
    appendMsg('user', message);

    // Show thinking indicator
    const thinkingEl = document.createElement('div');
    thinkingEl.className = 'msg-thinking';
    thinkingEl.id = 'thinking';
    thinkingEl.textContent = 'thinking...';
    container.appendChild(thinkingEl);
    scrollToBottom();

    // Create assistant message element
    const assistantEl = document.createElement('div');
    assistantEl.className = 'msg msg-assistant';
    let assistantText = '';

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history: chatHistory }),
      });

      if (!res.ok) throw new Error(`Server error: ${res.status}`);

      // Remove thinking, add assistant bubble
      thinkingEl.remove();
      container.appendChild(assistantEl);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const payload = JSON.parse(line.slice(6));
            if (payload.done) break;
            if (payload.error) {
              assistantText += `\n[Error: ${payload.error}]`;
              assistantEl.textContent = assistantText;
              break;
            }
            if (payload.text) {
              assistantText += payload.text;
              assistantEl.textContent = assistantText;
              scrollToBottom();
            }
          } catch { /* skip malformed */ }
        }
      }

      // Add "Save as Next Up" button to assistant message
      if (assistantText) {
        const saveBtn = document.createElement('button');
        saveBtn.className = 'save-rec-btn';
        saveBtn.textContent = 'Save as Next Up';
        saveBtn.onclick = () => saveRecommendation(assistantText, saveBtn);
        assistantEl.appendChild(saveBtn);
      }

      // Update chat history
      chatHistory.push({ role: 'user', content: message });
      chatHistory.push({ role: 'assistant', content: assistantText });

    } catch (err) {
      thinkingEl.remove();
      assistantEl.textContent = `Error: ${err.message}`;
      assistantEl.style.color = 'var(--red)';
      container.appendChild(assistantEl);
    } finally {
      isStreaming = false;
      document.getElementById('send-btn').disabled = false;
      scrollToBottom();
    }
  }

  function appendMsg(role, text) {
    const container = document.getElementById('chat-messages');
    const el = document.createElement('div');
    el.className = `msg msg-${role}`;
    el.textContent = text;
    container.appendChild(el);
    scrollToBottom();
  }

  function scrollToBottom() {
    const c = document.getElementById('chat-messages');
    c.scrollTop = c.scrollHeight;
  }

  async function saveRecommendation(text, btn) {
    btn.textContent = 'Saving...';
    btn.disabled = true;
    try {
      await fetch('/api/save-recommendation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const data = await fetchData();
      appData = data;
      render(data);
      btn.textContent = 'Saved to Next Up';
      btn.style.color = 'var(--green)';
      btn.style.borderColor = 'var(--green)';
    } catch {
      btn.textContent = 'Failed';
      btn.disabled = false;
    }
  }

  // ---- Topic detail modal ----

  function openTopicDetail(topicId) {
    const topic = (appData.topics || []).find(t => t.id === topicId);
    const cur = CURRICULUM[topicId];
    if (!topic || !cur) return;

    const depth = appData.topic_depth[topicId] || 'none';
    const count = appData.sessions.filter(s => s.topic_id === topicId).length;

    const STATUS_CYCLE = ['unread', 'done', 'campus'];
    const STATUS_LABEL = { unread: 'unread', done: '✓ done', campus: '⬇ get at campus' };
    const inSession = activeSession?.topicId === topicId;

    function section(type, label, items) {
      const rows = items.map(item => {
        const key = `${topicId}::${item.title}`;
        const status = (appData.resource_status || {})[key] || 'unread';
        const isChecked = inSession && activeSession.checkedItems.has(key);
        return `
        <div class="curriculum-item${inSession ? ' session-checkable' : ''}${isChecked ? ' item-checked' : ''}" ${inSession ? `onclick="toggleSessionItem('${key.replace(/'/g, "\\'")}', this)"` : ''}>
          ${inSession
            ? `<button class="session-check${isChecked ? ' checked' : ''}" onclick="event.stopPropagation();toggleSessionItem('${key.replace(/'/g, "\\'")}', this.closest('.curriculum-item'))"></button>`
            : `<div class="item-dot"></div>`
          }
          <div class="item-body">
            <div><span class="item-tag tag-${item.tag}">${item.tag}</span></div>
            <div class="item-title" id="title-${key.replace(/[^a-z0-9]/gi,'_')}">${(() => {
              const resolvedUrl = (appData.resource_urls || {})[key] || item.url;
              const link = resolvedUrl ? `<a href="${resolvedUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,0.25)">${item.title}</a>` : item.title;
              const editBtn = !inSession ? `<button class="url-edit-btn" onclick="event.stopPropagation();editResourceUrl('${key.replace(/'/g,"\\'")}')" title="Edit URL">&#9998;</button>` : '';
              return link + editBtn;
            })()}</div>
            <div class="item-sub">${item.sub}</div>
          </div>
          ${!inSession && ['paper','book','dataset'].includes(item.tag) ? `<div class="item-status"><button class="status-btn ${status}" onclick="cycleStatus(this, ${JSON.stringify(key)})">${STATUS_LABEL[status]}</button></div>` : ''}
        </div>`;
      }).join('');
      return `
        <div class="curriculum-section ${type}">
          <div class="curriculum-section-title ${type}">${label}</div>
          ${rows}
        </div>`;
    }

    const DEPTH_ORDER_M = ['none', 'awareness', 'working', 'applied', 'mastered'];
    function modalDepthBar(d) {
      const idx = DEPTH_ORDER_M.indexOf(d);
      return `<div class="depth-bar" style="margin-top:0;margin-left:8px;width:60px;flex-shrink:0">${[1,2,3,4].map(i =>
        `<div class="depth-seg${idx >= i ? ' filled' : ''}"></div>`
      ).join('')}</div>`;
    }

    document.getElementById('topic-modal-body').innerHTML = `
      <div class="topic-modal-header">
        <h2>${topic.name}</h2>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="depth-badge depth-${depth}">${depth}</span>
          ${modalDepthBar(depth)}
        </div>
      </div>
      <div class="topic-modal-desc">${topic.desc} &mdash; ${count} session${count !== 1 ? 's' : ''} logged</div>
      ${inSession ? `<div class="session-banner"><span class="session-banner-label">Session in progress — check off items as you cover them</span><span class="session-timer" id="session-timer-display">0:00</span></div>` : ''}
      ${section('read', 'Read', cur.read)}
      ${section('explore', 'Explore', cur.explore)}

        <div class="session-notes-section">
          <div class="session-notes-label">Session notes</div>
          <textarea class="session-notes-input" id="session-notes-input" placeholder="What did you learn? Questions that came up? Connections to your platform?"></textarea>
        </div>` : ''}
      <div class="topic-modal-footer">
        <button class="btn btn-ghost" onclick="closeTopicModal()">Close</button>
        ${inSession
          ? `<button class="btn btn-ghost" onclick="submitSessionNotes('${topicId}', '${topic.name.replace(/'/g, "\\'")}')">Submit to Companion</button>
             <button class="btn" onclick="endSession('${topicId}')">End &amp; Log Session</button>`
          : `<button class="btn" onclick="startSession('${topicId}')">Start Session</button>
             <button class="btn btn-ghost" onclick="askAboutTopic('${topic.name.replace(/'/g, "\\'")}')">Ask companion</button>`
        }
        ${cur.priority != null ? `<span class="priority-badge">Priority ${cur.priority} of 6</span>` : `<span class="priority-badge" style="color:var(--muted)">Covered in QuantWorkstation</span>`}

    document.getElementById('topic-overlay').classList.add('open');

    if (inSession) {
      if (activeSession.timerInterval) clearInterval(activeSession.timerInterval);
      activeSession.timerInterval = setInterval(() => {
        const el = document.getElementById('session-timer-display');
        if (!el) { clearInterval(activeSession.timerInterval); return; }
        const secs = Math.floor((Date.now() - activeSession.startTime) / 1000);
        el.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
      }, 1000);

  function closeTopicModal() {
    if (activeSession?.timerInterval) {
      clearInterval(activeSession.timerInterval);
      activeSession.timerInterval = null;

    document.getElementById('topic-overlay').classList.remove('open');

  function closeTopicIfOutside(e) {
    if (e.target === e.currentTarget) closeTopicModal();
  }

  // ---- Session ----

  function startSession(topicId) {
    if (activeSession?.timerInterval) clearInterval(activeSession.timerInterval);
    activeSession = { topicId, startTime: Date.now(), checkedItems: new Set(), timerInterval: null };
    openTopicDetail(topicId);
  }

  function toggleSessionItem(key, itemEl) {
    if (!activeSession) return;
    const check = itemEl.querySelector('.session-check');
    if (activeSession.checkedItems.has(key)) {
      activeSession.checkedItems.delete(key);
      itemEl.classList.remove('item-checked');
      if (check) check.classList.remove('checked');
    } else {
      activeSession.checkedItems.add(key);
      itemEl.classList.add('item-checked');
      if (check) check.classList.add('checked');
    }
  }

  function submitSessionNotes(topicId, topicName) {
    const notes = (document.getElementById('session-notes-input')?.value || '').trim();
    const checked = Array.from(activeSession?.checkedItems || [])
      .map(k => k.replace(`${topicId}::`, ''));

    let msg = `Study session — ${topicName}`;
    if (checked.length) {
      msg += `\n\nItems I covered:\n${checked.map(t => `• ${t}`).join('\n')}`;
    }
    if (notes) msg += `\n\nMy notes: ${notes}`;
    msg += `\n\nBased on what I covered, give me: (1) the key thing to remember from each item I checked, and (2) the single most important thing to tackle next session.`;

    closeTopicModal();
    const input = document.getElementById('chat-input');
    input.value = msg;
    document.querySelector('.chat-panel')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    sendMessage();
  }

  function endSession(topicId) {
    if (activeSession?.timerInterval) clearInterval(activeSession.timerInterval);
    const durationMin = Math.max(1, Math.round((Date.now() - (activeSession?.startTime || Date.now())) / 60000));
    activeSession = null;
    closeTopicModal();
    // Pre-fill and open log modal
    const topicSel = document.getElementById('log-topic');
    const durInput = document.getElementById('log-duration');
    if (topicSel) topicSel.value = topicId;
    if (durInput) durInput.value = durationMin;
    openModal();
  }

  function editResourceUrl(key) {
    const safeId = 'title-' + key.replace(/[^a-z0-9]/gi, '_');
    const titleDiv = document.getElementById(safeId);
    if (!titleDiv) return;
    const current = (appData.resource_urls || {})[key] || '';
    const input = document.createElement('input');
    input.className = 'url-inline-input';
    input.type = 'url';
    input.placeholder = 'https://arxiv.org/pdf/...';
    input.value = current;
    titleDiv.appendChild(input);
    input.focus();
    input.select();
    async function save() {
      const url = input.value.trim();
      if (!appData.resource_urls) appData.resource_urls = {};
      if (url) appData.resource_urls[key] = url; else delete appData.resource_urls[key];
      await fetch('/api/resource-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, url }),
      });
      // Re-open current topic to refresh link
      const topicId = key.split('::')[0];
      openTopicDetail(topicId);
    }
    input.addEventListener('blur', save);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } if (e.key === 'Escape') { input.removeEventListener('blur', save); titleDiv.removeChild(input); } });
  }

  async function cycleStatus(btn, key) {
    const cycle = ['unread', 'done', 'campus'];
    const labels = { unread: 'unread', done: '✓ done', campus: '⬇ get at campus' };
    const current = btn.dataset.status || cycle.find(s => btn.classList.contains(s)) || 'unread';
    const next = cycle[(cycle.indexOf(current) + 1) % cycle.length];
    btn.classList.remove(...cycle);
    btn.classList.add(next);
    btn.dataset.status = next;
    btn.textContent = labels[next];
    if (!appData.resource_status) appData.resource_status = {};
    appData.resource_status[key] = next;
    await fetch('/api/resource-status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, status: next }),
    });
  }

  function askAboutTopic(topicName) {
    closeTopicModal();
    const input = document.getElementById('chat-input');
    input.value = `What should I focus on first for ${topicName}? Give me a concrete starting point given my current depth.`;
    input.focus();
  }

  // ---- Session Log ----

  function openSessionLog() {
    const sessions = [...(appData?.sessions || [])].reverse();
    const body = document.getElementById('session-log-body');

    if (sessions.length === 0) {
      body.innerHTML = '<div style="color:var(--muted);padding:16px 0">No sessions logged yet.</div>';
    } else {
      body.innerHTML = sessions.map(s => `
        <div style="border-bottom:1px solid var(--border);padding:12px 0;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
            <span style="font-weight:600">${s.topic_name}</span>
            <span style="color:var(--muted);font-size:12px">${s.date}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:${s.notes ? '6px' : '0'}">
            ${s.duration_min}min &middot; <span class="depth-badge depth-${s.depth_after}" style="font-size:11px;padding:1px 6px">${s.depth_after}</span>
          </div>
          ${s.notes ? `<div style="font-size:13px;color:var(--text);white-space:pre-wrap">${escHtml(s.notes)}</div>` : ''}
        </div>
      `).join('');
    }

    document.getElementById('session-log-overlay').classList.add('open');
  }

  function closeSessionLog() {
    document.getElementById('session-log-overlay').classList.remove('open');
  }

  function closeSessionLogIfOutside(e) {
    if (e.target === e.currentTarget) closeSessionLog();
  }

  function escHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  boot();
