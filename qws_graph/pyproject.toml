[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qws-graph"
version = "0.1.0"
description = "Graph V1 infrastructure scaffold"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "neo4j>=5,<6",
  "sentence-transformers>=2.7",
  "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["research*"]

[project.scripts]
qw = "research.graph.cli:main"

